<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Product Radar — Cosmarab</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Cairo:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0a09; --bg-2:#14100e;
  --surface:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.07);
  --paper:#1a1512; --paper-2:#241c17;
  --line:rgba(230,201,122,.13); --line-2:rgba(255,255,255,.10);
  --ink:#F4EDE4; --ink-2:#cebfb0; --ink-soft:#8f8478;
  --red:#FF3B57; --red-soft:rgba(255,59,87,.13);
  --gold:#E6C97A; --gold-2:#F4DFA6; --gold-soft:rgba(230,201,122,.13);
  --ok:#3ad17f; --ok-soft:rgba(58,209,127,.12);
  --warn:#e7b34b; --warn-soft:rgba(231,179,75,.13);
  --shadow:0 40px 90px -40px rgba(0,0,0,.8);
  --disp:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,Arial,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(230,201,122,.07),transparent 60%),var(--bg)}
a{color:var(--gold);text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:11px}
.brand .dot{width:34px;height:34px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,var(--gold-2),var(--gold-deep,#C2A14D));
  display:grid;place-items:center;font-size:17px}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.hlinks{display:flex;gap:8px;align-items:center}
.hlinks a{font-size:12px;color:var(--ink-soft);padding:7px 11px;border:1px solid var(--line-2);border-radius:9px}
.hlinks a:hover{color:var(--ink);border-color:var(--line)}

/* ---------- login ---------- */
#login{max-width:360px;margin:14vh auto;padding:26px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
#login h2{font-family:var(--disp);font-size:18px;margin-bottom:5px}
#login p{font-size:12.5px;color:var(--ink-soft);margin-bottom:17px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.inp{width:100%;padding:11px 13px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--r-sm);color:var(--ink);outline:none}
.inp:focus{border-color:var(--gold);background:var(--surface-2)}
select.inp{cursor:pointer}
select.inp option{background:var(--paper);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;
  border-radius:var(--r-sm);font-weight:700;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#2a1f0c}
.btn-gold:hover{filter:brightness(1.08)}
.btn-gold:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{border:1px solid var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--ink)}
.btn-full{width:100%}

/* ---------- controls ---------- */
.controls{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;margin-bottom:20px;box-shadow:var(--shadow)}
.ctl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;align-items:end}

/* ---------- mode switch ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px;
  padding-top:13px;border-top:1px solid var(--line-2)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 13px;
  border:1px solid var(--line-2);border-radius:var(--r-sm);text-align:left;transition:.15s}
.mode b{font-size:13px;font-weight:700}
.mode span{font-size:11px;color:var(--ink-soft)}
.mode:hover{border-color:var(--line)}
.mode.on{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- free badge ---------- */
.freebadge{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:10px 12px;
  background:var(--ok-soft);border:1px solid rgba(58,209,127,.25);border-radius:var(--r-sm);
  font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.freebadge span{font-size:14px;flex:none}

.grp{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--gold);margin:13px 0 7px}
.grp:first-of-type{margin-top:4px}

/* ---------- verdict badges ---------- */
.vrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.vb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;
  border:1px solid var(--line-2);color:var(--ink-soft);letter-spacing:.02em}
.vb.rising{color:var(--ok);border-color:rgba(58,209,127,.35);background:var(--ok-soft)}
.vb.declining,.vb.peaked{color:var(--red);border-color:rgba(255,59,87,.35);background:var(--red-soft)}
.vb.plateau{color:var(--warn);border-color:rgba(231,179,75,.35);background:var(--warn-soft)}
.vb.heavy{color:var(--red);border-color:rgba(255,59,87,.35)}
.vb.none{color:var(--ok);border-color:rgba(58,209,127,.35)}
.kill{font-size:11.5px;line-height:1.5;color:#ffc2cb;background:var(--red-soft);
  border:1px solid rgba(255,59,87,.25);border-radius:8px;padding:8px 10px;margin-top:2px}
.kill b{color:#fff}
.unver{font-size:10.5px;color:var(--ink-soft);font-style:italic}

/* ---------- data-honesty banner ---------- */
.note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-sm);
  font-size:12.2px;line-height:1.5;margin-bottom:16px}
.note-info{background:var(--gold-soft);border:1px solid var(--line);color:var(--ink-2)}
.note-warn{background:var(--warn-soft);border:1px solid rgba(231,179,75,.3);color:#f3d9a0}
.note-bad{background:var(--red-soft);border:1px solid rgba(255,59,87,.3);color:#ffc2cb}
.note b{color:var(--ink)}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:15px}
.card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);
  padding:17px;display:flex;flex-direction:column;gap:11px;transition:.18s}
.card:hover{border-color:var(--line);transform:translateY(-2px)}
.card.blocked{opacity:.62}
.card-top{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}

/* product photo */
.shot{position:relative;width:100%;aspect-ratio:16/10;border-radius:var(--r-sm);
  overflow:hidden;background:var(--surface);border:1px solid var(--line-2);flex:none}
.shot img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.shot .ph{position:absolute;inset:0;display:grid;place-items:center;
  font-size:30px;opacity:.25}
.shot .tag{position:absolute;left:7px;bottom:7px;font-size:9.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
  background:rgba(10,7,5,.78);backdrop-filter:blur(4px);color:var(--ink-2)}
.shot .tag.ok{color:var(--ok)}
.shot a.zoom{position:absolute;right:7px;bottom:7px;font-size:9.5px;font-weight:700;
  padding:3px 7px;border-radius:5px;background:rgba(10,7,5,.78);
  backdrop-filter:blur(4px);color:var(--gold)}
.card h3{font-family:var(--disp);font-size:15.5px;font-weight:700;line-height:1.3}
.card .cat{font-size:11px;color:var(--ink-soft);margin-top:3px}

.score{flex:none;text-align:center;min-width:56px}
.score .num{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1}
.score .lbl{font-size:9px;font-weight:700;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
.s-strong .num,.s-strong .lbl{color:var(--ok)}
.s-test .num,.s-test .lbl{color:var(--gold)}
.s-risky .num,.s-risky .lbl{color:var(--warn)}
.s-avoid .num,.s-avoid .lbl{color:var(--red)}
.s-none .num{color:var(--ink-soft)} .s-none .lbl{color:var(--ink-soft)}
.r-neu .p{color:var(--ink-soft)}

.desc{font-size:12.7px;color:var(--ink-2);line-height:1.55}
.why{font-size:12.2px;color:var(--ink-soft);line-height:1.55;
  padding-left:10px;border-left:2px solid var(--line)}
.ev{font-size:11.5px;color:var(--ink-soft);font-style:italic;line-height:1.5}

.reasons{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.reason{display:flex;gap:7px;align-items:flex-start;font-size:11.6px;line-height:1.45}
.reason .p{font-family:var(--mono);font-size:10.5px;font-weight:600;flex:none;
  min-width:26px;text-align:right;padding-top:1px}
.r-pos .p{color:var(--ok)} .r-neg .p{color:var(--red)} .r-blk .p{color:var(--red)}
.reason span{color:var(--ink-soft)}

.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding-top:11px;border-top:1px solid var(--line-2);margin-top:auto}
.chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink-soft)}
.chip-hi{color:var(--ok);border-color:rgba(58,209,127,.3)}
.chip-lo{color:var(--warn);border-color:rgba(231,179,75,.3)}
.card-actions{display:flex;gap:8px;margin-top:11px}
.card-actions .btn{flex:1;padding:9px 12px;font-size:12.5px}

/* ---------- trending sidebar ---------- */
.two-col{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.side{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:16px}
.side h3{font-family:var(--disp);font-size:13px;font-weight:700;margin-bottom:4px}
.side .sub{font-size:11px;color:var(--ink-soft);margin-bottom:12px}
.tlist{display:flex;flex-direction:column;gap:9px}
.titem{display:flex;gap:9px;align-items:baseline;font-size:12.3px;line-height:1.4}
.titem .n{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:none;min-width:15px}
.titem .q{color:var(--ink-2);flex:1}
.titem .t{font-family:var(--mono);font-size:10px;color:var(--gold);flex:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(5,3,2,.82);backdrop-filter:blur(7px);
  display:none;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:60;overflow-y:auto}
.modal.on{display:flex}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  max-width:660px;width:100%;padding:24px;box-shadow:var(--shadow);margin:auto}
.sheet h2{font-family:var(--disp);font-size:19px;margin-bottom:3px}
.sheet .sh-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
.sec{margin-bottom:17px}
.sec h4{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);margin-bottom:7px}
.sec p{font-size:13px;color:var(--ink-2);line-height:1.6}
.namecard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.namecard:hover,.namecard.sel{border-color:var(--gold);background:var(--gold-soft)}
.namecard .ar{font-family:'Cairo',sans-serif;font-size:19px;font-weight:700;direction:rtl}
.namecard .tr{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.namecard .wy{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.srcs{display:flex;flex-direction:column;gap:6px}
.srcs a{font-size:11.5px;color:var(--ink-soft);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.srcs a:hover{color:var(--gold)}
.sheet-actions{display:flex;gap:9px;margin-top:20px;padding-top:17px;border-top:1px solid var(--line-2)}
.sheet-actions .btn{flex:1}

/* ---------- states ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--ink-soft)}
.empty .ico{font-size:36px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13px;max-width:400px;margin:0 auto;line-height:1.6}
.spin{width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#2a1f0c;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:13px}
.loading .bar{width:150px;height:2px;background:var(--line-2);border-radius:2px;
  margin:14px auto 0;overflow:hidden;position:relative}
.loading .bar::after{content:'';position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{left:-40%}100%{left:100%}}
.err{background:var(--red-soft);border:1px solid rgba(255,59,87,.3);color:#ffc2cb;
  padding:11px 13px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:14px}
.hide{display:none!important}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login" class="hide">
  <h2>Product Radar</h2>
  <p>Sign in with your Cosmarab admin account.</p>
  <div id="loginErr" class="err hide"></div>
  <div class="field"><label>Username</label><input id="lu" class="inp" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="lp" class="inp" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn btn-gold btn-full" style="margin-top:6px">Sign in</button>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="wrap hide">

  <header>
    <div class="brand">
      <div class="dot">📡</div>
      <div>
        <h1>Product Radar</h1>
        <p>Trend discovery → GCC fit → landing page</p>
      </div>
    </div>
    <div class="hlinks">
      <a href="/admin">Admin</a>
      <a href="/video-bot">Video Bot</a>
      <a href="#" id="logoutBtn">Sign out</a>
    </div>
  </header>

  <div class="controls">
    <div class="ctl-grid">
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Country</label>
        <select id="market" class="inp"></select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Niche</label>
        <select id="niche" class="inp"></select>
      </div>
      <div>
        <label style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Period</label>
        <select id="period" class="inp"></select>
      </div>
      <button id="goBtn" class="btn btn-gold">Find products</button>
    </div>

    <div class="modes">
      <button class="mode on" data-mode="quick">
        <b>⚡ Quick</b><span>3 seeds · ~500 real searches · ~20s</span>
      </button>
      <button class="mode" data-mode="deep">
        <b>🔬 Deep</b><span>All seeds · 1500+ real searches · ~30s</span>
      </button>
    </div>

    <div class="freebadge">
      <span>🆓</span>
      <div>Runs on Google Autocomplete, Google Trends and Amazon Best Sellers —
      all free and unlimited. One AI call per search, only to read that data.</div>
    </div>
  </div>

  <div id="banner"></div>
  <div id="out"></div>

</div>

<!-- ══════════ ANALYSIS MODAL ══════════ -->
<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ========================================================================
   Product Radar — client
   Talks only to /api/trends. No API keys in this file (unlike video-bot).
   ===================================================================== */
var API = '/api/trends';
var CFG = null;
var LAST = null;      // last discover payload
var CURRENT = null;   // product being analysed
var ANALYSIS = null;  // its analysis result

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function api(action, body){
  return fetch(API + '?action=' + action, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type':'application/json' },
    credentials: 'same-origin',
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    return r.json();
  });
}

/* ---------------- auth ---------------- */
function showLogin(){ $('login').classList.remove('hide'); $('app').classList.add('hide'); }
function showApp(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); }

function doLogin(){
  var e = $('loginErr'); e.classList.add('hide');
  var btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  fetch('/api/admin?action=login', {
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
    body: JSON.stringify({ user:$('lu').value, pass:$('lp').value })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if (!res.ok) throw new Error(res.j.error === 'bad_credentials' ? 'Wrong username or password.' : (res.j.error||'Login failed'));
      boot();
    })
    .catch(function(err){ e.textContent = err.message; e.classList.remove('hide'); })
    .then(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
}

$('loginBtn').onclick = doLogin;
$('lp').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });
$('logoutBtn').onclick = function(ev){
  ev.preventDefault();
  fetch('/api/admin?action=logout', { method:'GET', credentials:'same-origin' })
    .then(function(){ location.reload(); });
};

/* ---------------- boot ---------------- */
function boot(){
  api('config').then(function(c){
    if (!c.ok) { showLogin(); return; }
    CFG = c;
    fill('market', c.markets, 'code', 'name', 'US');
    fill('niche',  c.niches,  'code', 'label', 'beauty');
    fill('period', c.periods, 'code', 'label', '30d');
    showApp();
    if (!c.hasKey) {
      $('banner').innerHTML = '<div class="note note-bad">⚠️ <div><b>GEMINI_KEY is not set on the server.</b> '
        + 'Product research will fail until you add it in Vercel → Settings → Environment Variables.</div></div>';
    }
    renderEmpty();
  }).catch(function(){ showLogin(); });
}

function fill(id, arr, vk, lk, def){
  var s = $(id);
  s.innerHTML = arr.map(function(o){
    return '<option value="'+esc(o[vk])+'"'+(o[vk]===def?' selected':'')+'>'+esc(o[lk])+'</option>';
  }).join('');
}

function renderEmpty(){
  $('out').innerHTML = '<div class="empty"><div class="ico">🔍</div>'
    + '<p>Pick a country, niche and period, then hit <b>Find products</b>. '
    + 'Results are researched live from the web and scored against your GCC rules.</p></div>';
}

/* ---------------- discover ----------------
   One call. The server mines Google Autocomplete, Google Trends and Amazon
   Best Sellers (all free, unlimited) and makes a single AI call to read that
   data. Deep just widens the mining — it does not cost more AI calls.      */
var MODE = 'quick';

Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(b){
  b.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    MODE = b.getAttribute('data-mode');
    $('goBtn').textContent = MODE === 'deep' ? 'Deep search' : 'Find products';
  };
});

function isQuota(err){ return /quota_daily_exhausted|rate_limited|all_models_exhausted|429/.test(String(err||'')); }

function quotaBanner(){
  return '<div class="note note-bad">🛑 <div><b>Every free AI model is used up for now.</b> '
    + 'The app rotates through several models, so this is rare and resets on Google\'s daily cycle. '
    + 'The free data mining still worked — try again later, or in a different niche.</div></div>';
}

function busy(on){
  var btn = $('goBtn');
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="spin"></span> ' + (MODE === 'deep' ? 'Mining searches…' : 'Searching…')
    : (MODE === 'deep' ? 'Deep search' : 'Find products');
}

$('goBtn').onclick = function(){
  busy(true);
  $('banner').innerHTML = '';
  $('out').innerHTML = '<div class="loading">'
    + (MODE === 'deep'
        ? 'Mining thousands of real searches, bestsellers and trends…'
        : 'Mining real searches, bestsellers and trends…')
    + '<div class="bar"></div></div>';

  api('discover', {
    market: $('market').value,
    niche:  $('niche').value,
    period: $('period').value,
    deep:   MODE === 'deep'
  }).then(function(d){ LAST = d; render(d); })
    .catch(function(e){
      $('out').innerHTML = isQuota(e.message)
        ? quotaBanner()
        : '<div class="err">Search failed: '+esc(e.message)+'</div>';
    })
    .then(function(){ busy(false); });
};

function scoreClass(v){
  return v==='STRONG' ? 's-strong' : v==='WORTH TESTING' ? 's-test'
       : v==='RISKY' ? 's-risky' : v==='NO SIGNAL' ? 's-none' : 's-avoid';
}

function render(d){
  if (!d.ok) { $('out').innerHTML = '<div class="err">'+esc(d.error||'failed')+'</div>'; return; }

  /* ---- data-honesty banner: always state where numbers came from ---- */
  var b = '';
  if (isQuota(d.meta.aiError)) {
    b += quotaBanner();
  } else if (d.meta.aiError) {
    b += '<div class="note note-bad">⚠️ <div><b>Could not read the mined data.</b> '+esc(d.meta.aiError)+'</div></div>';
  } else {
    b += '<div class="note note-info">🆓 <div>'
      + '<b>'+(d.meta.demandCount||0)+' real search phrases</b> mined from Google Autocomplete'
      + (d.meta.bestsellerCount ? ', <b>'+d.meta.bestsellerCount+'</b> Amazon bestsellers' : '')
      + (d.trending && d.trending.length ? ', <b>'+d.trending.length+'</b> live trends' : '')
      + '. Seeds: <i>'+esc((d.meta.seeds||[]).join(', '))+'</i>. '
      + 'Read by <b>'+esc(d.meta.usedModel||'AI')+'</b> in one call — everything above is free and unlimited.'
      + '</div></div>';
  }
  if (d.meta.trendsError) {
    b += '<div class="note note-warn">⚠️ <div>Google Trends unavailable ('+esc(d.meta.trendsError)+').</div></div>';
  }
  if (d.meta.imagesTotal) {
    var ver = d.meta.imagesVerified || 0;
    b += '<div class="note note-info">🖼️ <div>'
      + '<b>'+ver+' of '+d.meta.imagesTotal+'</b> photos come from the actual product page '
      + '(marked <b>✓ product page</b>). The rest are image-search results for the product '
      + 'name — close, but not guaranteed to be that exact SKU. Click <b>source ↗</b> to check.'
      + '</div></div>';
  }
  $('banner').innerHTML = b;

  if (!d.products.length) {
    $('out').innerHTML = '<div class="empty"><div class="ico">🤷</div><p>No products came back. '
      + 'Try a different niche or a longer period.</p></div>';
    return;
  }

  var cards = d.products.map(function(p, i){ return card(p, i); }).join('');

  var side = '';
  if (d.trending && d.trending.length) {
    side = '<div class="side"><h3>Trending searches</h3>'
      + '<div class="sub">Google Trends · ' + esc(d.market) + ' · live</div>'
      + '<div class="tlist">' + d.trending.map(function(t, i){
          return '<div class="titem"><span class="n">'+(i+1)+'</span>'
            + '<span class="q">'+esc(t.query)+'</span>'
            + (t.traffic ? '<span class="t">'+esc(t.traffic)+'</span>' : '') + '</div>';
        }).join('') + '</div>'
      + '<div class="sub" style="margin:12px 0 0;font-size:10.5px">These are general search trends for the '
      + 'country, not product sales. Context only.</div></div>';
  }

  var srcBox = '';
  var dm = d.demand || {};
  if ((dm.problems && dm.problems.length) || (dm.wants && dm.wants.length)) {
    srcBox = '<div class="side" style="margin-top:14px"><h3>Real searches behind this</h3>'
      + '<div class="sub">Google Autocomplete — people actually type these</div>';
    if (dm.problems && dm.problems.length) {
      srcBox += '<div class="grp">😖 Unsolved problems</div><div class="tlist">'
        + dm.problems.slice(0,8).map(function(x){
            return '<div class="titem"><span class="q">'+esc(x.phrase)+'</span></div>';
          }).join('') + '</div>';
    }
    if (dm.wants && dm.wants.length) {
      srcBox += '<div class="grp">🛒 Buying intent</div><div class="tlist">'
        + dm.wants.slice(0,8).map(function(x){
            return '<div class="titem"><span class="q">'+esc(x.phrase)+'</span></div>';
          }).join('') + '</div>';
    }
    srcBox += '</div>';
  }
  if (d.bestsellers && d.bestsellers.length) {
    srcBox += '<div class="side" style="margin-top:14px"><h3>Amazon best sellers</h3>'
      + '<div class="sub">Live, from the local Amazon site</div><div class="tlist">'
      + d.bestsellers.slice(0,8).map(function(x,i){
          return '<div class="titem"><span class="n">'+(i+1)+'</span><span class="q">'+esc(x)+'</span></div>';
        }).join('') + '</div></div>';
  }

  $('out').innerHTML = (side || srcBox)
    ? '<div class="two-col"><div class="grid">'+cards+'</div><div>'+side+srcBox+'</div></div>'
    : '<div class="grid">'+cards+'</div>';
}

/* Saturation measured from real autocomplete data — not a model's opinion. */
function vbadges(p){
  var s = p.sat;
  if (!s) return '';
  var cls = s.gccStatus === 'unknown in GCC' ? 'none'
          : s.gccStatus === 'well known in GCC' ? 'heavy'
          : s.gccStatus === 'no search footprint' ? '' : 'plateau';
  var out = '<div class="vrow">'
    + '<span class="vb '+cls+'">🇸🇦 '+esc(s.gccStatus)+(s.gccHits?' ('+s.gccHits+')':'')+'</span>';
  if (s.rivalStatus && s.rivalStatus !== 'unmeasured')
    out += '<span class="vb '+(s.rivalStatus==='heavy competition'?'heavy':s.rivalStatus==='little competition'?'none':'')+'">'
      + esc(s.rivalStatus)+'</span>';
  if (s.demandStatus && s.demandStatus !== 'unmeasured')
    out += '<span class="vb '+(s.demandStatus==='strong search demand'?'none':'')+'">'+esc(s.demandStatus)+'</span>';
  out += '</div>';

  if (s.noFootprint) {
    out += '<div class="unver">No search footprint — this is a concept rather than a known product, '
      + 'so saturation could not be measured. Judge it yourself.</div>';
  }
  return out;
}

function scoutChips(p){
  var icons = { problem:'😖', demand:'🛒', bestseller:'📦', trend:'📈' };
  if (!p.signal) return '';
  var labels = { problem:'from a real complaint', demand:'from buying searches',
                 bestseller:'from Amazon top sellers', trend:'from live trends' };
  return '<span class="chip'+(p.signal==='problem'?' chip-hi':'')+'">'
    + (icons[p.signal]||'•') + ' ' + esc(labels[p.signal]||p.signal) + '</span>';
}

function card(p, i){
  var g = p.gcc;
  var conf = (p.confidence||'').toLowerCase();
  var confChip = conf ? '<span class="chip '+(conf==='high'?'chip-hi':conf==='low'?'chip-lo':'')+'">'
    + esc(conf)+' confidence</span>' : '';
  var priceChip = p.est_price_usd
    ? '<span class="chip">~$'+esc(p.est_price_usd)+' · '+Math.round(p.est_price_usd*3.75)+' SAR</span>'
    : '<span class="chip">price unknown</span>';

  var reasons = (g.reasons||[]).map(function(r){
    var k = r.kind==='blocker' ? 'r-blk' : r.kind==='positive' ? 'r-pos'
          : r.kind==='neutral' ? 'r-neu' : 'r-neg';
    var pts = r.pts===null ? (r.kind==='neutral' ? '–' : '✕') : (r.pts>0?'+':'')+r.pts;
    return '<div class="reason '+k+'"><span class="p">'+pts+'</span><span>'+esc(r.text)+'</span></div>';
  }).join('');

  var verified = p.image_source === 'og';
  var shot = '<div class="shot">'
    + '<div class="ph">📦</div>'
    + (p.image_url
        ? '<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" '
          + 'referrerpolicy="no-referrer" onerror="this.remove()">'
        : '')
    + '<span class="tag'+(verified?' ok':'')+'">'
      + (verified ? '✓ product page' : 'search image') + '</span>'
    + (p.product_url
        ? '<a class="zoom" href="'+esc(p.product_url)+'" target="_blank" rel="noopener">source ↗</a>'
        : '')
    + '</div>';

  return '<div class="card '+(g.blocked?'blocked':'')+'">'
    + shot
    + '<div class="card-top"><div>'
      + '<h3>'+esc(p.name)+'</h3>'
      + (p.category?'<div class="cat">'+esc(p.category)+'</div>':'')
    + '</div>'
    + '<div class="score '+scoreClass(g.verdict)+'">'
      + '<div class="num">'+(g.unscored ? '—' : g.score)+'</div>'
      + '<div class="lbl">'+esc(g.verdict)+'</div>'
    + '</div></div>'
    + (p.description?'<div class="desc">'+esc(p.description)+'</div>':'')
    + (p.why_trending?'<div class="why">'+esc(p.why_trending)+'</div>':'')
    + (p.evidence?'<div class="ev">“'+esc(p.evidence)+'”</div>':'')
    + vbadges(p)
    + '<div class="reasons">'+reasons+'</div>'
    + '<div class="meta-row">'+priceChip+confChip+scoutChips(p)+'</div>'
    + '<div class="card-actions">'
      + (g.blocked
          ? '<button class="btn btn-ghost" disabled style="opacity:.5;cursor:not-allowed">Blocked for GCC</button>'
          : '<button class="btn btn-gold" onclick="analyze('+i+')">Analyse for GCC</button>')
    + '</div></div>';
}

/* ---------------- analyse ---------------- */
function analyze(i){
  var p = LAST.products[i];
  CURRENT = p; ANALYSIS = null;
  $('modal').classList.add('on');
  $('sheet').innerHTML = '<div class="loading">Checking GCC saturation and building name ideas…<div class="bar"></div></div>';

  api('analyze', { product: p, market: LAST.marketCode }).then(function(d){
    ANALYSIS = d;
    renderAnalysis(d, p);
  }).catch(function(e){
    $('sheet').innerHTML = (isQuota(e.message)
        ? quotaBanner()
        : '<div class="err">Analysis failed: '+esc(e.message)+'</div>')
      + '<div class="sheet-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>';
  });
}

function renderAnalysis(d, p){
  var a = d.analysis;
  if (!a) {
    var err = (d.meta && d.meta.aiError) || '';
    $('sheet').innerHTML = (isQuota(err)
        ? quotaBanner()
        : '<div class="err">Could not analyse this product. ' + esc(err) + '</div>')
      + '<div class="sheet-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>';
    return;
  }

  var satTone = a.gcc_saturation==='none' ? 'note-info' : a.gcc_saturation==='heavy' ? 'note-bad' : 'note-warn';
  var riskTone = a.ad_policy_risk==='low' ? 'note-info' : a.ad_policy_risk==='high' ? 'note-bad' : 'note-warn';

  var names = (a.names||[]).map(function(n, i){
    return '<div class="namecard" data-i="'+i+'" onclick="pickName(this)">'
      + '<div class="ar">'+esc(n.ar)+'</div>'
      + '<div class="tr">'+esc(n.translit)+' — '+esc(n.en)+'</div>'
      + '<div class="wy">'+esc(n.why)+'</div></div>';
  }).join('');

  var srcs = (d.sources||[]).map(function(s){
    return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||s.url)+'</a>';
  }).join('');

  $('sheet').innerHTML =
      (p.image_url
        ? '<div class="shot" style="aspect-ratio:16/7;margin-bottom:15px">'
          + '<div class="ph">📦</div>'
          + '<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" '
          + 'referrerpolicy="no-referrer" onerror="this.remove()">'
          + (p.product_url ? '<a class="zoom" href="'+esc(p.product_url)+'" target="_blank" rel="noopener">source ↗</a>' : '')
          + '</div>'
        : '')
    + '<h2>'+esc(p.name)+'</h2>'
    + '<div class="sh-sub">'+(d.gcc.unscored
        ? 'GCC fit: no rule matched — judge this one on the analysis below'
        : 'GCC fit '+d.gcc.score+'/100 — '+esc(d.gcc.verdict))+'</div>'

    + '<div class="note '+satTone+'">📦 <div><b>GCC saturation: '+esc(a.gcc_saturation)+'.</b> '
      + esc(a.saturation_evidence||'')+'</div></div>'
    + '<div class="note '+riskTone+'">📣 <div><b>Ad policy risk: '+esc(a.ad_policy_risk)+'.</b> '
      + esc(a.ad_policy_note||'')+'</div></div>'

    + '<div class="sec"><h4>The reformat play</h4><p>'+esc(a.reformat_idea||'')+'</p></div>'
    + '<div class="sec"><h4>Target customer</h4><p>'+esc(a.target_customer||'')+'</p></div>'
    + '<div class="sec"><h4>Main objection at the door</h4><p>'+esc(a.main_objection||'')+'</p>'
      + '<p style="margin-top:7px;color:var(--ink)"><b>Counter:</b> '+esc(a.objection_answer||'')+'</p></div>'
    + '<div class="sec"><h4>Ad angles</h4><p>'+(a.angles||[]).map(function(x){return '• '+esc(x);}).join('<br>')+'</p></div>'
    + '<div class="sec"><h4>Verdict</h4><p style="color:var(--ink)">'+esc(a.verdict||'')+'</p></div>'

    + '<div class="sec"><h4>Brand name — pick one</h4>'+names+'</div>'

    + (srcs ? '<div class="sec"><h4>Sources checked</h4><div class="srcs">'+srcs+'</div></div>' : '')

    + '<div class="sheet-actions">'
      + '<button class="btn btn-ghost" onclick="closeModal()">Close</button>'
      + '<button class="btn btn-gold" id="buildBtn" onclick="buildLp()">Build landing page draft</button>'
    + '</div>';
}

function pickName(el){
  Array.prototype.forEach.call(document.querySelectorAll('.namecard'), function(n){ n.classList.remove('sel'); });
  el.classList.add('sel');
}

function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click', function(ev){ if (ev.target === $('modal')) closeModal(); });

/* ---------------- build LP ---------------- */
function buildLp(){
  var a = ANALYSIS.analysis;
  var sel = document.querySelector('.namecard.sel');
  var idx = sel ? +sel.getAttribute('data-i') : 0;
  var nm = (a.names||[])[idx] || {};

  var slug = prompt('Folder name for the draft (letters, numbers, dashes):',
    'ksa-' + (nm.translit||CURRENT.name||'new').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,14).replace(/^-|-$/g,''));
  if (!slug) return;

  var btn = $('buildBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Building…';

  api('buildLp', {
    slug: slug,
    productName: CURRENT.name,
    arabicName: nm.ar,
    priceSar: a.suggested_price_sar,
    market: LAST.marketCode
  }).then(function(d){
    if (!d.ok) throw new Error(d.error === 'draft_exists'
      ? 'A draft already exists at ' + d.path : (d.detail || d.error));

    if (d.mode === 'download') {
      var blob = new Blob([d.html], { type:'text/html' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = 'index.html'; link.click();
      URL.revokeObjectURL(url);
    }

    $('sheet').innerHTML = '<h2>Draft ready</h2>'
      + '<div class="sh-sub">'+esc(d.mode==='download'
          ? 'Downloaded as index.html — put it in a folder named /'+d.slug+'/'
          : 'Written to ' + d.path)+'</div>'
      + '<div class="note note-warn">⚠️ <div><b>This is a skeleton, not a finished page.</b> '
        + 'It has the right price, SKU and tracking wiring, but the copy and images are still the '
        + 'lip-serum template\'s. It is not linked anywhere and nothing is live.</div></div>'
      + '<div class="sec"><h4>Still to do by hand</h4><p>'
        + (d.notes||[]).map(function(n){ return '• '+esc(n); }).join('<br>') + '</p></div>'
      + '<div class="sheet-actions"><button class="btn btn-gold" onclick="closeModal()">Done</button></div>';
  }).catch(function(e){
    alert('Build failed: ' + e.message);
    btn.disabled = false; btn.textContent = 'Build landing page draft';
  });
}

/* ---------------- start ---------------- */
api('config').then(function(c){ if (c.ok) boot(); else showLogin(); }).catch(showLogin);
</script>
</body>
</html>
