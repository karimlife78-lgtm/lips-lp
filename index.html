<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#15110F" />
<title>Cosmarab — Luxury Lip Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#D90A2C;--gold:#C2A14D;--ink:#15110F}
body{font-family:'Tajawal',system-ui,Arial,sans-serif;background:var(--ink);color:#fff;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px}
.logo{font-family:'Cairo',sans-serif;font-size:36px;font-weight:900;letter-spacing:.06em;margin-bottom:8px}
.logo span{color:var(--gold)}
.tag{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.45);margin-bottom:48px}
.products{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.product-btn{display:block;padding:18px 24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;color:#fff;text-decoration:none;font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;transition:background .2s,border-color .2s}
.product-btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.25)}
.product-btn .sub{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.5);margin-top:3px;font-family:'Tajawal',sans-serif}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-left:8px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
footer{margin-top:48px;font-size:12px;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="logo">COS<span>MARAB</span></div>
<div class="tag">LUXURY LIP CARE</div>
<div class="products">
  <a href="/ksa-18" class="product-btn">
    <span class="dot"></span>سيروم تفتيح الشفاه
    <span class="sub">Jinshan Lip Serum · المملكة العربية السعودية</span>
  </a>
</div>
<footer>© <span id="y"></span> Cosmarab — جميع الحقوق محفوظة</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
