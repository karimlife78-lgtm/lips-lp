<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="hbg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3A2211"/>
      <stop offset="0.6" stop-color="#241610"/>
      <stop offset="1" stop-color="#170D08"/>
    </radialGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6ECDD"/>
      <stop offset="0.52" stop-color="#EDE0CC"/>
      <stop offset="0.52" stop-color="#A85422"/>
      <stop offset="1" stop-color="#7C3A14"/>
    </linearGradient>
    <linearGradient id="cap" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F4C06A"/>
      <stop offset="0.45" stop-color="#CE7F1E"/>
      <stop offset="0.8" stop-color="#98491533"/>
      <stop offset="1" stop-color="#5E2C0D"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5651E"/>
      <stop offset="1" stop-color="#7A3D12"/>
    </linearGradient>
    <radialGradient id="caphl" cx="0.35" cy="0.25" r="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#hbg)"/>
  <ellipse cx="300" cy="285" rx="250" ry="230" fill="url(#hglow)"/>

  <!-- cinnamon sticks (stylized rolled bark) -->
  <g transform="rotate(-24 150 430)">
    <rect x="70" y="405" width="180" height="34" rx="17" fill="url(#stick)"/>
    <rect x="70" y="405" width="20" height="34" rx="10" fill="#5E2C0D" opacity="0.6"/>
    <line x1="120" y1="408" x2="120" y2="436" stroke="#5E2C0D" stroke-width="2" opacity="0.4"/>
    <line x1="160" y1="408" x2="160" y2="436" stroke="#5E2C0D" stroke-width="2" opacity="0.4"/>
  </g>
  <g transform="rotate(-16 165 455)">
    <rect x="95" y="452" width="210" height="30" rx="15" fill="url(#stick)"/>
    <rect x="95" y="452" width="18" height="30" rx="9" fill="#5E2C0D" opacity="0.55"/>
    <line x1="150" y1="455" x2="150" y2="479" stroke="#5E2C0D" stroke-width="2" opacity="0.35"/>
    <line x1="200" y1="455" x2="200" y2="479" stroke="#5E2C0D" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- product pouch -->
  <g transform="translate(300 290)">
    <rect x="-118" y="-165" width="236" height="330" rx="26" fill="url(#pouch)"/>
    <rect x="-118" y="-165" width="236" height="26" rx="13" fill="#FFFFFF" opacity="0.6"/>
    <text x="0" y="-70" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="30" fill="#8A3D14" letter-spacing="1">CEYLORA</text>
    <line x1="-70" y1="-46" x2="70" y2="-46" stroke="#B5541E" stroke-width="2"/>
    <text x="0" y="-16" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="800" font-size="15" fill="#9A4E17">CEYLON CINNAMON</text>
    <text x="0" y="8" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="700" font-size="12" fill="#A85422">WITH MCT OIL</text>
    <text x="0" y="120" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="900" font-size="17" fill="#F6ECDD">120 SOFTGELS</text>
  </g>

  <!-- softgel capsules in front -->
  <g transform="translate(232 452) rotate(-18)">
    <ellipse cx="0" cy="0" rx="26" ry="46" fill="url(#cap)"/>
    <ellipse cx="-8" cy="-16" rx="8" ry="16" fill="url(#caphl)"/>
  </g>
  <g transform="translate(300 470) rotate(8)">
    <ellipse cx="0" cy="0" rx="27" ry="48" fill="url(#cap)"/>
    <ellipse cx="-9" cy="-18" rx="9" ry="17" fill="url(#caphl)"/>
  </g>
  <g transform="translate(372 452) rotate(22)">
    <ellipse cx="0" cy="0" rx="26" ry="46" fill="url(#cap)"/>
    <ellipse cx="-8" cy="-16" rx="8" ry="16" fill="url(#caphl)"/>
  </g>
</svg>
