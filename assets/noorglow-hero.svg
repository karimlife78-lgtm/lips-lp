<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="nbg" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#251C5C"/>
      <stop offset="0.6" stop-color="#140E30"/>
      <stop offset="1" stop-color="#0A0718"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#E8B23D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8B23D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D488"/>
      <stop offset="0.5" stop-color="#E8B23D"/>
      <stop offset="1" stop-color="#8A6216"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3D9E"/>
      <stop offset="1" stop-color="#251C5C"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#nbg)"/>

  <!-- scattered stars -->
  <g fill="#F5EFE0" opacity="0.7">
    <circle cx="80" cy="70" r="1.6"/><circle cx="180" cy="40" r="1.2"/><circle cx="480" cy="60" r="1.8"/>
    <circle cx="540" cy="130" r="1.3"/><circle cx="90" cy="160" r="1.2"/><circle cx="510" cy="220" r="1.5"/>
    <circle cx="60" cy="260" r="1.1"/><circle cx="400" cy="50" r="1.4"/>
  </g>

  <!-- ground glow beneath lamp -->
  <ellipse cx="300" cy="430" rx="230" ry="150" fill="url(#glow)"/>

  <!-- mandala shadow pattern cast on ground (the hook) -->
  <g transform="translate(300 420)" opacity="0.55" stroke="#E8B23D" stroke-width="2" fill="none">
    <circle r="150"/>
    <circle r="118"/>
    <circle r="86"/>
    <g id="petals">
      <path d="M0,-150 L0,-86" /><path d="M0,150 L0,86" />
      <path d="M-150,0 L-86,0" /><path d="M150,0 L86,0" />
      <path d="M-106,-106 L-61,-61" /><path d="M106,106 L61,61" />
      <path d="M106,-106 L61,-61" /><path d="M-106,106 L-61,61" />
    </g>
  </g>

  <!-- decorative garden fence posts (silhouette, evokes majlis/garden wall) -->
  <g fill="#0A0718" opacity="0.85">
    <rect x="40" y="440" width="14" height="120" rx="4"/>
    <rect x="90" y="440" width="14" height="120" rx="4"/>
    <rect x="496" y="440" width="14" height="120" rx="4"/>
    <rect x="546" y="440" width="14" height="120" rx="4"/>
  </g>

  <!-- the lamp/light unit -->
  <g transform="translate(300 340)">
    <!-- pole -->
    <rect x="-8" y="0" width="16" height="90" rx="6" fill="url(#pole)"/>
    <!-- solar panel cap -->
    <rect x="-46" y="-30" width="92" height="34" rx="10" fill="url(#pole)"/>
    <rect x="-38" y="-24" width="76" height="20" rx="6" fill="#1C1440"/>
    <!-- mandala disc face -->
    <circle cx="0" cy="-46" r="34" fill="url(#lamp)"/>
    <circle cx="0" cy="-46" r="34" fill="none" stroke="#8A6216" stroke-width="2" opacity="0.5"/>
    <g stroke="#8A6216" stroke-width="1.4" opacity="0.6">
      <circle cx="0" cy="-46" r="22"/>
      <circle cx="0" cy="-46" r="11"/>
      <line x1="-34" y1="-46" x2="34" y2="-46"/>
      <line x1="0" y1="-80" x2="0" y2="-12"/>
      <line x1="-24" y1="-70" x2="24" y2="-22"/>
      <line x1="24" y1="-70" x2="-24" y2="-22"/>
    </g>
  </g>
</svg>
